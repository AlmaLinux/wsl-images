name: Build AlmaLinux OS 10 WSL images
run-name: >-
  Build AlmaLinux OS 10 WSL images${{ inputs.pungi_repos && ' (PUNGI)' || '' }}
on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Build number of image version'
        default: 0
        type: number
      pungi_repos:
        description: 'Build from PUNGI pre-release repositories instead of the public ones'
        default: false
        type: boolean
      release:
        description: 'Release on GitHub'
        default: false
        type: boolean
      almalinux_chat_notiy:
        description: 'Notify AlmaLinux Chat'
        default: true
        type: boolean
      almalinux_chat_channel:
        description: 'Channel name on AlmaLinux Chat'
        default: sigcloud
        type: string
jobs:
  prepare:
    name: Build timestamp and version
    runs-on: ubuntu-26.04
    outputs:
      timestamp: ${{ steps.timestamp_and_version.outputs.timestamp }}
      version: ${{ steps.timestamp_and_version.outputs.version }}
      minor_version: ${{ steps.minor_version.outputs.minor_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Generate timestamp and version
        id: timestamp_and_version
        run: |
          timestamp=$(date -u '+%Y%m%d%H%M%S')
          version=${timestamp:0:8}
          echo "timestamp=$timestamp" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Minor version
        id: minor_version
        run: |
          # Derive the minor version from the almalinux-release package in
          # the BaseOS repository the images are built from, so the image
          # names, the object storage paths and the GitHub release tag agree
          # with /etc/almalinux-release inside the images without hardcoding
          # the minor version.
          if [[ '${{ inputs.pungi_repos }}' == 'true' ]]; then
            # The PUNGI compose ships the pre-release almalinux-release
            # (e.g. 10.X+1 while the public repository still ships 10.X).
            export PUNGI_REPOS=1
          fi
          release=$(bash tools/almalinux-release.sh 10)
          minor_version=${release#10.}
          echo "[Debug] almalinux-release version: ${release}"
          echo "minor_version=${minor_version}" >> "$GITHUB_OUTPUT"
  build:
    name: Build images
    needs: prepare
    strategy:
      matrix:
        architecture:
          - x64
          - x64_v2
          - ARM64
        runner:
          - ubuntu-26.04
          - ubuntu-26.04-arm
        exclude:
          - architecture: x64
            runner: ubuntu-26.04-arm
          - architecture: x64_v2
            runner: ubuntu-26.04-arm
          - architecture: ARM64
            runner: ubuntu-26.04
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Enable PUNGI repositories
        if: inputs.pungi_repos
        run: |
          # Rewrite the rootfs build scripts to install from the PUNGI
          # pre-release composes instead of the public repositories.
          bash tools/pungi-repos.sh

      - name: Build a WSL image
        run: bash -x rootfs/almalinux_10_${{ matrix.architecture }}.sh ${{ needs.prepare.outputs.minor_version }} ${{ inputs.build_number }}

      - name: Upload artifacts to GitHub
        uses: actions/upload-artifact@v7
        with:
          name: AlmaLinux_10_${{ matrix.architecture }}
          path: AlmaLinux-10.*_*.wsl*

      - name: Upload artifact to AlmaLinux Cloud object storage
        if: ${{ ! inputs.release }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ALMALINUX_CLOUD_BOT_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ALMALINUX_CLOUD_BOT_AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: 'us-east-1'
        run: |
          aws s3 cp . \
              s3://almalinux-cloud/images/10/10.${{ needs.prepare.outputs.minor_version }}/wsl/${{ needs.prepare.outputs.timestamp }}/ \
              --recursive \
              --exclude '*' --include '*.wsl*'
          aws s3api put-object-tagging \
              --bucket almalinux-cloud \
              --key images/10/10.${{ needs.prepare.outputs.minor_version }}/wsl/${{ needs.prepare.outputs.timestamp }}/AlmaLinux-10.${{ needs.prepare.outputs.minor_version }}_${{ matrix.architecture }}_${{ needs.prepare.outputs.version }}.${{ inputs.build_number }}.wsl \
              --tagging 'TagSet={Key=public,Value=yes}'
          aws s3api put-object-tagging \
              --bucket almalinux-cloud \
              --key images/10/10.${{ needs.prepare.outputs.minor_version }}/wsl/${{ needs.prepare.outputs.timestamp }}/AlmaLinux-10.${{ needs.prepare.outputs.minor_version }}_${{ matrix.architecture }}_${{ needs.prepare.outputs.version }}.${{ inputs.build_number }}.wsl.sha256sum \
              --tagging 'TagSet={Key=public,Value=yes}'
  release:
    if: ${{ inputs.release }}
    name: Release images on GitHub
    runs-on: ubuntu-26.04
    needs:
      - prepare
      - build
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download artifacts for release
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release \
              create "v10.${{ needs.prepare.outputs.minor_version }}.${{ needs.prepare.outputs.version }}.${{ inputs.build_number }}" \
              --title "AlmaLinux OS 10.${{ needs.prepare.outputs.minor_version }}.${{ needs.prepare.outputs.version }}.${{ inputs.build_number }}" \
              --generate-notes \
              --latest \
              ./*.wsl ./*.sha256sum
  notify_build:
    if: ${{ ! inputs.release && inputs.almalinux_chat_notiy }}
    name: Notify AlmaLinux Chat about test builds
    needs:
      - prepare
      - build
    runs-on: ubuntu-26.04
    steps:
      - name: Notify AlmaLinux Chat
        env:
          image_url_x64: https://almalinux-cloud.s3-accelerate.dualstack.amazonaws.com/images/10/10.${{ needs.prepare.outputs.minor_version }}/wsl/${{ needs.prepare.outputs.timestamp }}/AlmaLinux-10.${{ needs.prepare.outputs.minor_version }}_x64_${{ needs.prepare.outputs.version }}.${{ inputs.build_number }}.wsl
          image_url_x64_v2: https://almalinux-cloud.s3-accelerate.dualstack.amazonaws.com/images/10/10.${{ needs.prepare.outputs.minor_version }}/wsl/${{ needs.prepare.outputs.timestamp }}/AlmaLinux-10.${{ needs.prepare.outputs.minor_version }}_x64_v2_${{ needs.prepare.outputs.version }}.${{ inputs.build_number }}.wsl
          image_url_ARM64: https://almalinux-cloud.s3-accelerate.dualstack.amazonaws.com/images/10/10.${{ needs.prepare.outputs.minor_version }}/wsl/${{ needs.prepare.outputs.timestamp }}/AlmaLinux-10.${{ needs.prepare.outputs.minor_version }}_ARM64_${{ needs.prepare.outputs.version }}.${{ inputs.build_number }}.wsl
          checksum_url_x64: https://almalinux-cloud.s3-accelerate.dualstack.amazonaws.com/images/10/10.${{ needs.prepare.outputs.minor_version }}/wsl/${{ needs.prepare.outputs.timestamp }}/AlmaLinux-10.${{ needs.prepare.outputs.minor_version }}_x64_${{ needs.prepare.outputs.version }}.${{ inputs.build_number }}.wsl.sha256sum
          checksum_url_x64_v2: https://almalinux-cloud.s3-accelerate.dualstack.amazonaws.com/images/10/10.${{ needs.prepare.outputs.minor_version }}/wsl/${{ needs.prepare.outputs.timestamp }}/AlmaLinux-10.${{ needs.prepare.outputs.minor_version }}_x64_v2_${{ needs.prepare.outputs.version }}.${{ inputs.build_number }}.wsl.sha256sum
          checksum_url_ARM64: https://almalinux-cloud.s3-accelerate.dualstack.amazonaws.com/images/10/10.${{ needs.prepare.outputs.minor_version }}/wsl/${{ needs.prepare.outputs.timestamp }}/AlmaLinux-10.${{ needs.prepare.outputs.minor_version }}_ARM64_${{ needs.prepare.outputs.version }}.${{ inputs.build_number }}.wsl.sha256sum
        uses: mattermost/action-mattermost-notify@v2.1.0
        with:
          MATTERMOST_WEBHOOK_URL: ${{ secrets.MM_WEBHOOK_URL }}
          MATTERMOST_CHANNEL: ${{ inputs.almalinux_chat_channel }}
          MATTERMOST_USERNAME: 'github'
          TEXT: |
            ##### [TEST]: AlmaLinux OS 10.${{ needs.prepare.outputs.minor_version }} WSL Images [Build](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}): `${{ needs.prepare.outputs.timestamp }}`
            ${{ inputs.pungi_repos && ':warning: Built from **PUNGI pre-release repositories**' || '' }}
            ###### Images
            :almalinux: **x64:** [AlmaLinux-10.${{ needs.prepare.outputs.minor_version }}_x64_${{ needs.prepare.outputs.version }}.${{ inputs.build_number }}.wsl](${{ env.image_url_x64 }})
            :almalinux: **x64_v2:** [AlmaLinux-10.${{ needs.prepare.outputs.minor_version }}_x64_v2_${{ needs.prepare.outputs.version }}.${{ inputs.build_number }}.wsl](${{ env.image_url_x64_v2 }})
            :almalinux: **ARM64:** [AlmaLinux-10.${{ needs.prepare.outputs.minor_version }}_ARM64_${{ needs.prepare.outputs.version }}.${{ inputs.build_number }}.wsl](${{ env.image_url_ARM64 }})
            ###### Checksums
            :lock_with_ink_pen: **x64:** [AlmaLinux-10.${{ needs.prepare.outputs.minor_version }}_x64_${{ needs.prepare.outputs.version }}.${{ inputs.build_number }}.wsl.sha256sum](${{ env.checksum_url_x64 }})
            :lock_with_ink_pen: **x64_v2:** [AlmaLinux-10.${{ needs.prepare.outputs.minor_version }}_x64_v2_${{ needs.prepare.outputs.version }}.${{ inputs.build_number }}.wsl.sha256sum](${{ env.checksum_url_x64_v2 }})
            :lock_with_ink_pen: **ARM64:** [AlmaLinux-10.${{ needs.prepare.outputs.minor_version }}_ARM64_${{ needs.prepare.outputs.version }}.${{ inputs.build_number }}.wsl.sha256sum](${{ env.checksum_url_ARM64 }})
  notify_release:
    name: Notify AlmaLinux Chat about release builds
    needs:
      - prepare
      - release
    runs-on: ubuntu-26.04
    steps:
      - name: Notify AlmaLinux Chat
        env:
          image_url_x64: ${{ github.server_url }}/${{ github.repository }}/releases/download/v10.${{ needs.prepare.outputs.minor_version }}.${{ needs.prepare.outputs.version }}.${{ inputs.build_number }}/AlmaLinux-10.${{ needs.prepare.outputs.minor_version }}_x64_${{ needs.prepare.outputs.version }}.${{ inputs.build_number }}.wsl
          image_url_x64_v2: ${{ github.server_url }}/${{ github.repository }}/releases/download/v10.${{ needs.prepare.outputs.minor_version }}.${{ needs.prepare.outputs.version }}.${{ inputs.build_number }}/AlmaLinux-10.${{ needs.prepare.outputs.minor_version }}_x64_v2_${{ needs.prepare.outputs.version }}.${{ inputs.build_number }}.wsl
          image_url_ARM64: ${{ github.server_url }}/${{ github.repository }}/releases/download/v10.${{ needs.prepare.outputs.minor_version }}.${{ needs.prepare.outputs.version }}.${{ inputs.build_number }}/AlmaLinux-10.${{ needs.prepare.outputs.minor_version }}_ARM64_${{ needs.prepare.outputs.version }}.${{ inputs.build_number }}.wsl
          checksum_url_x64: ${{ github.server_url }}/${{ github.repository }}/releases/download/v10.${{ needs.prepare.outputs.minor_version }}.${{ needs.prepare.outputs.version }}.${{ inputs.build_number }}/AlmaLinux-10.${{ needs.prepare.outputs.minor_version }}_x64_${{ needs.prepare.outputs.version }}.${{ inputs.build_number }}.wsl.sha256sum
          checksum_url_x64_v2: ${{ github.server_url }}/${{ github.repository }}/releases/download/v10.${{ needs.prepare.outputs.minor_version }}.${{ needs.prepare.outputs.version }}.${{ inputs.build_number }}/AlmaLinux-10.${{ needs.prepare.outputs.minor_version }}_x64_v2_${{ needs.prepare.outputs.version }}.${{ inputs.build_number }}.wsl.sha256sum
          checksum_url_ARM64: ${{ github.server_url }}/${{ github.repository }}/releases/download/v10.${{ needs.prepare.outputs.minor_version }}.${{ needs.prepare.outputs.version }}.${{ inputs.build_number }}/AlmaLinux-10.${{ needs.prepare.outputs.minor_version }}_ARM64_${{ needs.prepare.outputs.version }}.${{ inputs.build_number }}.wsl.sha256sum
        uses: mattermost/action-mattermost-notify@v2.1.0
        with:
          MATTERMOST_WEBHOOK_URL: ${{ secrets.MM_WEBHOOK_URL }}
          MATTERMOST_CHANNEL: ${{ inputs.almalinux_chat_channel }}
          MATTERMOST_USERNAME: 'github'
          TEXT: |
            ##### [RELEASE]: AlmaLinux OS 10.${{ needs.prepare.outputs.minor_version }} WSL Images [Build](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}): `${{ needs.prepare.outputs.timestamp }}`
            ${{ inputs.pungi_repos && ':warning: Built from **PUNGI pre-release repositories**' || '' }}
            ###### Images
            :almalinux: **x64:** [AlmaLinux-10.${{ needs.prepare.outputs.minor_version }}_x64_${{ needs.prepare.outputs.version }}.${{ inputs.build_number }}.wsl](${{ env.image_url_x64 }})
            :almalinux: **x64_v2:** [AlmaLinux-10.${{ needs.prepare.outputs.minor_version }}_x64_v2_${{ needs.prepare.outputs.version }}.${{ inputs.build_number }}.wsl](${{ env.image_url_x64_v2 }})
            :almalinux: **ARM64:** [AlmaLinux-10.${{ needs.prepare.outputs.minor_version }}_ARM64_${{ needs.prepare.outputs.version }}.${{ inputs.build_number }}.wsl](${{ env.image_url_ARM64 }})
            ###### Checksums
            :lock_with_ink_pen: **x64:** [AlmaLinux-10.${{ needs.prepare.outputs.minor_version }}_x64_${{ needs.prepare.outputs.version }}.${{ inputs.build_number }}.wsl.sha256sum](${{ env.checksum_url_x64 }})
            :lock_with_ink_pen: **x64_v2:** [AlmaLinux-10.${{ needs.prepare.outputs.minor_version }}_x64_v2_${{ needs.prepare.outputs.version }}.${{ inputs.build_number }}.wsl.sha256sum](${{ env.checksum_url_x64_v2 }})
            :lock_with_ink_pen: **ARM64:** [AlmaLinux-10.${{ needs.prepare.outputs.minor_version }}_ARM64_${{ needs.prepare.outputs.version }}.${{ inputs.build_number }}.wsl.sha256sum](${{ env.checksum_url_ARM64 }})
